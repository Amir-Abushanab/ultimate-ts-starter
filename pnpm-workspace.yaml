packages:
  - apps/*
  - packages/*
catalog:
  "@better-auth/expo": 1.6.11
  "@better-auth/sso": 1.6.11
  "@cloudflare/workers-types": ^4.20260415.1
  "@orpc/client": ^1.12.2
  "@orpc/openapi": ^1.12.2
  "@orpc/server": ^1.12.2
  "@orpc/tanstack-query": ^1.13.6
  "@orpc/zod": ^1.12.2
  "@polar-sh/better-auth": ^1.8.3
  "@tanstack/react-form": ^1.28.0
  "@types/react-dom": ^19.2.3
  "@typescript/native-preview": 7.0.0-dev.20260415.1
  better-auth: 1.6.11
  dotenv: ^17.4.2
  hono: ^4.8.2
  lucide-react: ^0.546.0
  next-themes: ^0.4.6
  sonner: ^2.0.5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.1.18
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  zod: ^4.3.6
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Expo SDK 57 / RN 0.86 Babel plugins (babel-preset-expo, react-native-worklets,
  # @babel/preset-typescript) are Babel-7-only (assertVersion "^7.0.0-0"). Vite 8 /
  # rolldown pull @babel/core 8 into the workspace, and pnpm otherwise mis-pairs the
  # RN plugins with it — breaking Metro's transform (WorkletsBabelPluginError:
  # "Requires Babel ^7.0.0-0, but was loaded with 8.0.1"). @rolldown/plugin-babel
  # accepts "^7.29.0 || ^8", so pinning Babel 7 is safe for the web tooling too.
  "@babel/core": "7.29.0"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain defense: skip versions younger than N minutes (7 days = 10080).
# Applies to every install (including transitive deps), not just upgrades.
# Defense-in-depth alongside `cooldown: '7d'` in .ncurc.cjs.
#
# RE-ENABLED 2026-06-27 (requires pnpm >= 11.2.0; we pin 11.8.0). The old
# ERR_PNPM_MISSING_TIME hard-fail on direct deps is fixed: pnpm 11.1.3 reworked
# the release-age gate and 11.2.0 fixed the boundary case that surfaced as
# MISSING_TIME, so `minimumReleaseAgeIgnoreMissingTime` now applies to direct
# deps too, not just transitive trees as in 11.0.9.
#
# NOTE: because we set this explicitly, `minimumReleaseAgeStrict` defaults to
# true — a fresh (<7d) non-excluded pick prompts locally / fails a
# non-interactive (CI) install rather than silently falling back. That's the
# cooldown doing its job. Add the package to minimumReleaseAgeExclude below, or
# set `minimumReleaseAgeStrict: false` here, if you'd rather installs fall back
# to the freshest mature version instead of failing.
minimumReleaseAge: 10080
# Some registry packages omit publish-time metadata; bypass the cooldown check
# for those rather than failing install. Default true; since pnpm 11.2.0 this
# applies to direct deps as well as transitive ones (see note above).
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  # Cloudflare platform packages — trusted publisher, frequent releases.
  - "@cloudflare/*"
  - workerd
  - wrangler
  # miniflare is the Workers simulator wrangler pins to an EXACT version, so a
  # fresh wrangler release leaves no mature in-range fallback and strict mode
  # hard-fails. Trust it like the rest of the CF toolchain — it's just not
  # under the @cloudflare/* scope.
  - miniflare
  # Trusted infra publishers that release frequently.
  - "@tailwindcss/*"
  - tailwindcss
  # react-scan + transitives have registry metadata gaps that slip past
  # minimumReleaseAgeIgnoreMissingTime in some pnpm versions.
  - react-scan
  - "@react-grab/*"
  - react-grab
  - bippy
  # Storybook scope — devDeps only, registry metadata gaps tripping the check.
  - "@storybook/*"
  # drizzle ships frequent patch releases; trusted publisher.
  - drizzle-orm
  - drizzle-kit
  # ─────────────────────────────────────────────────────────────────────────
  # TEMPORARY (added 2026-07-01): Expo SDK 57 shipped ~2026-06-30, still inside
  # the 7-day cooldown. Exclude the Expo/RN toolchain so `expo install` can pull
  # 57 now. REMOVE THIS BLOCK once 57 clears the cooldown (~2026-07-08) and
  # re-run `pnpm install` to re-assert the gate. TODO: remove after 2026-07-08.
  - expo
  - "@expo/*"
  - "expo-*"
  - babel-preset-expo
  - react-native
  - "@react-native/*"
  # ─────────────────────────────────────────────────────────────────────────
# pnpm 11+ requires explicit per-package approval for install scripts.
# Anything not listed here will silently skip its postinstall — fine for
# analytics-only scripts, breaking for things that compile native bindings
# (sharp, workerd, esbuild). Re-run `pnpm install` after adding new entries.
allowBuilds:
  core-js: true # ES feature polyfills, prints postinstall banner
  esbuild: true # downloads native binary for the host platform
  msw: true # generates mockServiceWorker.js for browser tests
  protobufjs: true # builds long.js / protobuf bindings
  sharp: true # native libvips bindings for image processing
  spawn-sync: true # builds the sync-spawn helper (legacy transitive dep)
  workerd: true # downloads the Cloudflare Workers runtime binary
