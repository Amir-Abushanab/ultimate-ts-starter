  "@orpc/server": ^1.12.2
  "@orpc/tanstack-query": ^1.13.6
  "@orpc/zod": ^1.12.2
  "@polar-sh/better-auth": ^1.8.3
  "@tanstack/react-form": ^1.28.0
  "@types/react-dom": ^19.2.3
  "@typescript/native-preview": 7.0.0-dev.20260415.1
  better-auth: 1.6.11
  dotenv: ^17.4.2
